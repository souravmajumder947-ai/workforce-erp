name: Validate V15.2 Management Final Payroll

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v152-validate-management-final-payroll.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Compile app
        run: python -m py_compile app.py
      - name: Verify V15.2 markers
        run: |
          grep -q "V15.2 MANAGEMENT FINAL PAYROLL SOURCE" app.py
          grep -q "Final Net Payable" app.py
          grep -q "Payroll Source" app.py
      - name: Record validation
        run: |
          printf "V15.2 validated\n" > .v152_validation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .v152_validation
          git commit -m "Validate Management final payroll dashboard"
          git push origin main
