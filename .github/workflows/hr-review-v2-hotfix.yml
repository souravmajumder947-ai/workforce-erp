name: HR Review V2 Hotfix

on:
  push:
    paths:
      - '.github/workflows/hr-review-v2-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply HR Review V2 patch
        run: python tools/hr_review_v2_patch.py
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Commit live HR Review V2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Upgrade HR Review with filters and selected bulk resolution"
            git push origin main
          fi
