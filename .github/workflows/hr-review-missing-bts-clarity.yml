name: HR Review Missing BTS Clarity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hr-review-missing-bts-clarity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clarify missing BTS attendance in HR Review
        run: python tools/hr_review_missing_bts_clarity_patch.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit HR Review clarity update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Clarify BTS missing attendance by division"
            git push origin main
          fi
