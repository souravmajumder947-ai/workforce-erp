name: V9.3 Global Search and Management MIS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v93-global-search-management-mis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add global search and management MIS centre
        run: python tools/v93_global_search_management_mis_patch.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit live app update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add global search and management MIS centre"
            git push origin main
          fi
