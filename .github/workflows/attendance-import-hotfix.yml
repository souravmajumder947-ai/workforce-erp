name: Attendance Import Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attendance-import-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-attendance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply attendance FK review patch
        run: python tools/attendance_hr_review_patch.py
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Commit live attendance fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix unknown employee attendance FK import"
            git push origin main
          fi
