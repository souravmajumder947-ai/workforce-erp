name: BTS Full Attendance Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bts-full-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add fresh BTS attendance refresh mode
        run: python tools/bts_full_refresh_patch.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit fresh attendance refresh mode
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add fresh BTS attendance refresh mode"
            git push origin main
          fi
