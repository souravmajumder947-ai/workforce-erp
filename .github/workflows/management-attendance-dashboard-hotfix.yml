name: Management Attendance Dashboard Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/management-attendance-dashboard-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply management attendance correction
        run: python tools/management_attendance_dashboard_patch.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit live management dashboard update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix management attendance coverage dashboard"
            git push origin main
          fi
