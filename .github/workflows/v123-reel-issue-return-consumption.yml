name: V12.3 Reel Issue Return Consumption

on:
  push:
    branches: [main]
    paths:
      - "tools/v123_reel_issue_return_consumption.py"
      - ".github/workflows/v123-reel-issue-return-consumption.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V12.3 reel material-flow patch
        run: python tools/v123_reel_issue_return_consumption.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Audit UI controls
        run: python tools/v104_button_audit.py
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Add reel issue return consumption reporting"
          git pull --rebase origin main
          git push origin main
