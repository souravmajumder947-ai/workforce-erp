name: HR Review UI Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hr-review-multiselect-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Hide internal attendance database ID
        run: python tools/hr_review_hide_db_id_patch.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit live HR Review UI update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Hide internal attendance ID from HR Review"
            git push origin main
          fi
