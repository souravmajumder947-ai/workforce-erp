name: V10 Live Reference Dashboard

on:
  push:
    branches: [main]
    paths:
      - "tools/v10_live_reference_dashboard_patch.py"
      - ".github/workflows/v10-live-reference-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V10 live dashboard patch
        run: python tools/v10_live_reference_dashboard_patch.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Commit app update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Make V10 reference dashboard live"
          git pull --rebase origin main
          git push origin main
