name: V12.6 Show Imported Finsys Movements

on:
  push:
    branches: [main]
    paths:
      - "tools/v126_show_imported_finsys_movements.py"
      - ".github/workflows/v126-show-imported-finsys-movements.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V12.6 report visibility fix
        run: python tools/v126_show_imported_finsys_movements.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Audit UI controls
        run: python tools/v104_button_audit.py
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Show imported reel movements in reports"
          git pull --rebase origin main
          git push origin main
