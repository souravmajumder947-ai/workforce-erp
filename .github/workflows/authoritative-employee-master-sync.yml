name: Authoritative Employee Master Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/authoritative-employee-master-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add authoritative Employee Master sync
        run: python tools/authoritative_employee_master_sync_patch.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit authoritative master sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add authoritative Employee Master sync"
            git push origin main
          fi
