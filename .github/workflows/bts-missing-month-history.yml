name: BTS Missing Monthly History Classifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bts-missing-month-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add BTS missing monthly history classifier
        run: python tools/bts_missing_month_history_patch.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit live app update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Classify BTS missing employees by monthly history"
            git push origin main
          fi
