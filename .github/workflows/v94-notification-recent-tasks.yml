name: V9.4 Notification Recent Tasks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v94-notification-recent-tasks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add notification centre recent menu and task monitoring
        run: python tools/v94_notification_recent_tasks_patch.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit live app update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add notification centre recent menu and task monitoring"
            git push origin main
          fi
