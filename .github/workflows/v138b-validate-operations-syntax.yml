name: Validate Operations Syntax Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v138b-validate-operations-syntax.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile app
        run: python -m py_compile app.py
      - name: Verify syntax-fix marker
        run: |
          grep -q "V13.8B MOVE CONSUMPTION SCHEMA HELPER BEFORE PAGE ROUTING" app.py
      - name: Record validation
        run: |
          printf "V13.8B validated\n" > .v138b_validation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .v138b_validation
          git commit -m "Validate Operations syntax fix"
          git push origin main
