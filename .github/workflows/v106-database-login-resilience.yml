name: V10.6 Database Login Resilience

on:
  push:
    branches: [main]
    paths:
      - "tools/v106_database_login_resilience_patch.py"
      - ".github/workflows/v106-database-login-resilience.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V10.6 resilience patch
        run: python tools/v106_database_login_resilience_patch.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Audit UI controls
        run: python tools/v104_button_audit.py
      - name: Commit app update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Harden database reconnect and login flow"
          git pull --rebase origin main
          git push origin main
