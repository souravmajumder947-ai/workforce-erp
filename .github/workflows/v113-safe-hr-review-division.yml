name: V11.3 Safe HR Review Division Resolution

on:
  push:
    branches: [main]
    paths:
      - "tools/v113_safe_hr_review_division_resolution.py"
      - ".github/workflows/v113-safe-hr-review-division.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V11.3 safety patch
        run: python tools/v113_safe_hr_review_division_resolution.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Audit UI controls
        run: python tools/v104_button_audit.py
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Separate attendance division from employee master moves"
          git pull --rebase origin main
          git push origin main
