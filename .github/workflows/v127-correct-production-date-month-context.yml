name: V12.7 Correct Production Date Month Context

on:
  push:
    branches: [main]
    paths:
      - "tools/v127_correct_production_date_month_context.py"
      - ".github/workflows/v127-correct-production-date-month-context.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V12.7 date/month correction
        run: python tools/v127_correct_production_date_month_context.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Audit UI controls
        run: python tools/v104_button_audit.py
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Correct production date and month controls"
          git pull --rebase origin main
          git push origin main
