name: V10.4 UI Quality Audit

on:
  push:
    branches: [main]
    paths:
      - "tools/v104_ui_quality_setup_patch.py"
      - "tools/v104_button_audit.py"
      - ".github/workflows/v104-ui-quality-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V10.4 UI quality patch
        run: python tools/v104_ui_quality_setup_patch.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Audit button wiring and widget keys
        run: python tools/v104_button_audit.py
      - name: Commit app update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Polish app controls tabs and attendance layout"
          git pull --rebase origin main
          git push origin main
