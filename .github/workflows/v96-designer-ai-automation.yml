name: V9.6 Designer AI Automation

on:
  push:
    branches: [main]
    paths:
      - "tools/v96_designer_ai_automation_patch.py"
      - ".github/workflows/v96-designer-ai-automation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V9.6 patch
        run: python tools/v96_designer_ai_automation_patch.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Commit app update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Upgrade HRMS designer AI automation command centre"
          git pull --rebase origin main
          git push origin main
