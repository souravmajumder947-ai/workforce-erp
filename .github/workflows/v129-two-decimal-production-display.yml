name: V12.9 Two Decimal Production Display

on:
  push:
    branches: [main]
    paths:
      - "tools/v129_two_decimal_production_display.py"
      - ".github/workflows/v129-two-decimal-production-display.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V12.9 display formatting
        run: python tools/v129_two_decimal_production_display.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Audit UI controls
        run: python tools/v104_button_audit.py
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Show production values with two decimals"
          git pull --rebase origin main
          git push origin main
