name: Inactive Attendance Skip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inactive-attendance-skip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Skip inactive employees from attendance import
        run: python tools/inactive_attendance_skip_patch.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit inactive attendance rule
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Skip inactive employees from attendance import"
            git push origin main
          fi
