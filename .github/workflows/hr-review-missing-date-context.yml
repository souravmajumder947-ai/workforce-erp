name: HR Review Missing Attendance Date Context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hr-review-missing-date-context.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align missing attendance with review period
        run: python tools/hr_review_missing_date_context_patch.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit HR review date context update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Align missing attendance with HR review period"
            git push origin main
          fi
