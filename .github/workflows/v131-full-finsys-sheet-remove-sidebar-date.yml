name: V13.1 Full Finsys Sheet and Remove Sidebar Date

on:
  push:
    branches: [main]
    paths:
      - "tools/v131_full_finsys_sheet_and_remove_sidebar_date.py"
      - ".github/workflows/v131-full-finsys-sheet-remove-sidebar-date.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V13.1 full Finsys sheet report
        run: python tools/v131_full_finsys_sheet_and_remove_sidebar_date.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Audit UI controls
        run: python tools/v104_button_audit.py
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Match Finsys full sheet reports and remove sidebar date"
          git pull --rebase origin main
          git push origin main
