name: V10.8 Strict Production Readiness

on:
  push:
    branches: [main]
    paths:
      - "tools/v108_strict_readiness_patch.py"
      - ".github/workflows/v108-strict-readiness.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V10.8 strict readiness
        run: python tools/v108_strict_readiness_patch.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Audit UI controls
        run: python tools/v104_button_audit.py
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Make production readiness checks strict and data-aware"
          git pull --rebase origin main
          git push origin main
