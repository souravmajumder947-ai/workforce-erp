name: BTS Refresh Date Cast Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hr-review-hide-db-id.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix PostgreSQL date array cast in BTS refresh
        run: python tools/bts_full_refresh_patch.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit BTS date cast fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then
            echo 'No app.py changes to commit.'
          else
            git commit -m 'Fix BTS attendance refresh date cast'
            git push origin main
          fi
