name: V11.1 Expected Division Fix

on:
  push:
    branches: [main]
    paths:
      - "tools/v111_expected_division_fix.py"
      - ".github/workflows/v111-expected-division-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V11.1 expected division fix
        run: python tools/v111_expected_division_fix.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Audit UI controls
        run: python tools/v104_button_audit.py
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Respect selected attendance division and validate by master"
          git pull --rebase origin main
          git push origin main
