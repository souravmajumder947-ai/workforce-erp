name: V12.5 Paired Finsys Reel Movement Import

on:
  push:
    branches: [main]
    paths:
      - "tools/v125_finsys_paired_issue_return_import.py"
      - ".github/workflows/v125-finsys-paired-reel-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V12.5 paired Finsys reel import patch
        run: python tools/v125_finsys_paired_issue_return_import.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Audit UI controls
        run: python tools/v104_button_audit.py
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Add paired Finsys reel movement importer"
          git pull --rebase origin main
          git push origin main
